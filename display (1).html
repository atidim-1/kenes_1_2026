<style>
:root{
  --white:#fff;--paper:#EAF2FB;
  --navy:#1A2A5E;--navy2:#0F1D44;
  --cyan:#00B4E6;--cyan-d:rgba(0,180,230,.15);--cyan-r:rgba(0,180,230,.45);
  --mag:#E800C8;
  --grid:rgba(0,120,200,.08);
  --ff:'Heebo',sans-serif;--fm:'IBM Plex Mono',monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--white);color:var(--navy);font-family:var(--ff)}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:42px 42px}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 70% 50% at 50% -10%,rgba(0,180,230,.07) 0%,transparent 55%),
    radial-gradient(ellipse 50% 40% at 100% 100%,rgba(26,42,94,.04) 0%,transparent 50%)}

/* ── TOP BAR ── */
#topBar{
  position:fixed;top:0;left:0;right:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 28px;background:var(--navy);border-bottom:3px solid var(--cyan);height:68px}
.tb-logo img{height:50px;object-fit:contain}
.tb-center{text-align:center}
.tb-title{font-size:clamp(11px,1.4vw,16px);font-weight:700;color:var(--white);letter-spacing:.05em}
.tb-sub{font-size:clamp(9px,1vw,11px);color:rgba(255,255,255,.42);font-family:var(--fm);letter-spacing:.1em;margin-top:2px}
.tb-right{display:flex;align-items:center;gap:14px;flex-shrink:0}
.tb-count-wrap{text-align:center}
.tb-count{font-size:clamp(26px,4.2vw,52px);font-weight:900;color:var(--cyan);line-height:1;
  text-shadow:0 0 24px rgba(0,180,230,.4);transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.tb-count.pop{transform:scale(1.35)}
.tb-count-sub{font-family:var(--fm);font-size:9px;color:rgba(255,255,255,.38);letter-spacing:.1em;margin-top:2px}
.tb-live{display:flex;align-items:center;gap:6px;font-family:var(--fm);font-size:11px;color:var(--cyan)}
.tb-live::before{content:'';width:8px;height:8px;background:var(--cyan);border-radius:50%;
  box-shadow:0 0 10px var(--cyan);animation:livePulse 1.5s infinite}
.tb-time{font-family:var(--fm);font-size:13px;color:rgba(255,255,255,.32)}
.tb-btn{background:rgba(0,180,230,.14);border:1px solid rgba(0,180,230,.32);
  border-radius:8px;padding:6px 13px;font-size:12px;font-weight:700;
  color:var(--cyan);cursor:pointer;font-family:var(--ff);transition:all .2s}
.tb-btn:hover{background:rgba(0,180,230,.28)}

/* ── SKY STAGE ── */
#sky{position:fixed;top:68px;left:0;right:0;bottom:62px;overflow:hidden;z-index:1}

/* ── FLYING BIRD UNIT ── */
.bird-unit{
  position:absolute;right:-280px;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  pointer-events:none;
  animation:flyAcross linear forwards;
}
/* horizontal flight with sine-wave vertical drift */
@keyframes flyAcross{
  0%  {right:-280px;margin-top:0px}
  15% {margin-top:-35px}
  30% {margin-top:25px}
  45% {margin-top:-30px}
  60% {margin-top:20px}
  75% {margin-top:-25px}
  90% {margin-top:15px}
  100%{right:110vw;margin-top:0px}
}

/* Bird SVG — wings flap */
.bird-svg{overflow:visible;display:block}
.wing-r{transform-origin:5px -4px;animation:flapR .52s ease-in-out infinite alternate}
.wing-l{transform-origin:-5px -4px;animation:flapL .52s ease-in-out infinite alternate}
@keyframes flapR{0%{transform:rotate(-25deg)}100%{transform:rotate(22deg)}}
@keyframes flapL{0%{transform:rotate(25deg)}100%{transform:rotate(-22deg)}}

/* Name+dream label */
.bird-label{
  text-align:center;
  background:rgba(255,255,255,.88);
  border:1.5px solid rgba(0,180,230,.35);
  border-radius:10px;padding:6px 16px;
  backdrop-filter:blur(6px);
  box-shadow:0 3px 14px rgba(26,42,94,.1);
  max-width:260px;
}
.bird-name{font-size:clamp(14px,1.8vw,20px);font-weight:900;color:var(--navy);line-height:1.2;white-space:nowrap}
.bird-dream{font-size:clamp(10px,1.2vw,14px);font-weight:400;font-style:italic;
  color:#006E9B;margin-top:3px;line-height:1.3;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* ── BOTTOM BAR ── */
#botBar{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:8px 28px;background:var(--navy);border-top:2px solid rgba(0,180,230,.3);height:62px}
.bb-hiaat img{height:36px;object-fit:contain}
#qrBox{background:#fff;border-radius:7px;padding:5px;border:2px solid rgba(0,180,230,.4);flex-shrink:0}
/* alternating slogan */
.bb-slogans{flex:1;text-align:center;position:relative;height:30px;overflow:hidden}
.bb-slo{
  position:absolute;left:0;right:0;
  font-size:clamp(12px,1.7vw,18px);font-weight:900;
  letter-spacing:.03em;line-height:1;top:50%;transform:translateY(-50%);
  transition:opacity .6s ease;
}
.bb-slo-m{color:var(--cyan);animation:sloAlt 8s 0s infinite}
.bb-slo-f{color:#FF66E8;animation:sloAlt 8s 4s infinite}
@keyframes sloAlt{0%,42%{opacity:1}50%,92%{opacity:0}100%{opacity:1}}
.bb-fs{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
  border-radius:8px;padding:7px 14px;font-size:12px;color:rgba(255,255,255,.45);
  cursor:pointer;font-family:var(--ff);transition:all .2s;flex-shrink:0}
.bb-fs:hover{border-color:var(--cyan);color:var(--cyan)}

/* ── SPOTLIGHT ── */
#spotlight{
  position:fixed;inset:0;z-index:100;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
  background:rgba(240,247,255,.97);opacity:0;transition:opacity .4s ease}
#spotlight.on{opacity:1;pointer-events:all}
.spl-rays{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.spl-ray{position:absolute;bottom:50%;left:50%;width:2px;transform-origin:bottom center;
  background:linear-gradient(to top,rgba(0,180,230,.22),transparent);animation:rayIn .9s ease-out both}
.spl-prts{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.spp{position:absolute;border-radius:50%;animation:ptFly linear forwards}
.spl-card{
  position:relative;z-index:2;background:var(--navy);border-radius:26px;
  padding:clamp(24px,3.5vw,50px) clamp(32px,5.5vw,70px);text-align:center;
  max-width:min(960px,92vw);
  box-shadow:0 30px 80px rgba(26,42,94,.35);overflow:hidden;
  animation:cardIn .6s cubic-bezier(.16,1,.3,1) both}
.spl-card::before{content:'';position:absolute;inset:0;
  background-image:linear-gradient(rgba(0,180,230,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,180,230,.05) 1px,transparent 1px);background-size:36px 36px}
.spl-card::after{content:'';position:absolute;top:0;left:0;bottom:0;width:6px;
  background:linear-gradient(to bottom,var(--cyan),rgba(0,180,230,.25));border-radius:0 0 0 26px}
.spl-glow{position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,180,230,.1) 0%,transparent 55%)}
.spl-logo{height:clamp(28px,3.5vw,46px);object-fit:contain;filter:brightness(0) invert(1);
  margin-bottom:14px;position:relative;z-index:1;animation:fadeUp .35s ease both}
.spl-welcome{font-family:var(--fm);font-size:clamp(9px,1.2vw,13px);letter-spacing:.28em;
  color:var(--cyan);margin-bottom:12px;position:relative;z-index:1;animation:fadeUp .35s ease .05s both}
.spl-name{font-size:clamp(48px,11vw,130px);font-weight:900;line-height:.92;
  margin-bottom:18px;position:relative;z-index:1;animation:nameBlast .65s cubic-bezier(.16,1,.3,1) .1s both}
.spl-name-first{display:block;color:var(--cyan)}
.spl-name-last{display:block;color:var(--white)}
.spl-dream{background:rgba(0,180,230,.1);border:1.5px solid rgba(0,180,230,.35);
  border-radius:14px;padding:16px 24px;position:relative;z-index:1;animation:fadeUp .4s ease .45s both}
.spl-dream-lbl{font-family:var(--fm);font-size:clamp(9px,1.1vw,12px);letter-spacing:.22em;
  color:rgba(0,180,230,.7);margin-bottom:6px}
.spl-dream-txt{font-size:clamp(18px,3vw,38px);font-weight:700;color:var(--white);font-style:italic;line-height:1.25}

/* KEYFRAMES */
@keyframes livePulse{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes nameBlast{from{opacity:0;transform:scale(.28)}to{opacity:1;transform:scale(1)}}
@keyframes cardIn{from{opacity:0;transform:scale(.8) translateY(32px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes rayIn{from{height:0;opacity:0}to{height:55vh;opacity:1}}
@keyframes ptFly{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(0)}}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:rgba(0,120,200,.2);border-radius:3px}
</style>
</head>

  function injectLogos(){
    document.getElementById("tbLogo").src   = FULL_LOGO;
    document.getElementById("splHiaat").src = HIAAT;
    document.getElementById("bbHiaat").src  = HIAAT;
  }

  var db;
  try{ firebase.initializeApp(FB); db=firebase.database(); }
  catch(e){ console.error("Firebase:",e); }

  var known={}, spotQ=[], spotBusy=false;
  var allEntries=[], birdIdx=0, activeBirds=0;
  var MAX_BIRDS=4;

  /* ── clock ── */
  function ftime(d){ return d.toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"}); }
  function tick(){ document.getElementById("tbTime").textContent=ftime(new Date()); }
  tick(); setInterval(tick,1000);

  function setCount(n){
    var el=document.getElementById("tbCount"); if(!el)return;
    el.textContent=n; el.classList.add("pop");
    setTimeout(function(){ el.classList.remove("pop"); },300);
  }

  /* ── QR ── */
  function drawQR(){
    try{ new QRCode(document.getElementById("qrBox"),{
      text:"https://atidim-1.github.io/kenes2026/",
      width:50,height:50,colorDark:"#000",colorLight:"#fff"
    }); }catch(e){}
  }

  /* ── FLYING BIRDS ── */
  var birdColors = ["#1A2A5E","#00B4E6","#0F1D44","#006E9B"];

  function makeBirdSVG(color, scale){
    var s=scale, c=color;
    var w=Math.round(80*s), h=Math.round(50*s);
    /* bird body: ellipse + head + beak + wings + tail */
    return '<svg width="'+w+'" height="'+h+'" viewBox="-55 -32 110 55" style="color:'+c+';overflow:visible">'+
      '<ellipse cx="0" cy="0" rx="13" ry="5" fill="currentColor"/>'+
      '<circle cx="15" cy="-4" r="5.5" fill="currentColor"/>'+
      '<path d="M 19,-5 L 27,-4 L 19,-3 Z" fill="currentColor"/>'+
      '<path class="wing-r" d="M 5,-4 Q 28,-26 50,-11 Q 28,-9 5,-4 Z" fill="currentColor" style="transform-origin:5px -4px"/>'+
      '<path class="wing-l" d="M -5,-4 Q -28,-26 -50,-11 Q -28,-9 -5,-4 Z" fill="currentColor" style="transform-origin:-5px -4px"/>'+
      '<path d="M -13,0 L -26,-7 L -26,7 Z" fill="currentColor"/>'+
      '</svg>';
  }

  function launchBird(entry){
    if(activeBirds>=MAX_BIRDS) return;
    activeBirds++;
    var sky=document.getElementById("sky");
    var el=document.createElement("div");
    el.className="bird-unit";

    var top   = 8  + Math.random()*64;
    var dur   = 13 + Math.random()*9;
    var scale = 0.65 + Math.random()*0.55;
    var color = birdColors[Math.floor(Math.random()*birdColors.length)];
    var flap  = (0.38 + Math.random()*0.35).toFixed(2);

    el.style.top             = top+"%";
    el.style.animationDuration = dur+"s";

    var svg = makeBirdSVG(color, scale);

    /* inject flap animation via inline style on wings */
    svg = svg.replace(
      'class="wing-r"',
      'class="wing-r" style="transform-origin:5px -4px;animation:flapR '+flap+'s ease-in-out infinite alternate"'
    ).replace(
      'class="wing-l"',
      'class="wing-l" style="transform-origin:-5px -4px;animation:flapL '+flap+'s ease-in-out infinite alternate"'
    );

    var label = '<div class="bird-label">'+
      '<div class="bird-name">'+entry.name+'</div>'+
      (entry.future ? '<div class="bird-dream">'+entry.future+'</div>' : '')+
      '</div>';

    el.innerHTML = svg + label;
    sky.appendChild(el);

    setTimeout(function(){ el.remove(); activeBirds--; }, dur*1000+500);
  }

  /* scheduler — continuously cycle through all entries */
  function scheduleBirds(){
    if(allEntries.length>0 && activeBirds<MAX_BIRDS){
      var entry = allEntries[birdIdx % allEntries.length];
      birdIdx++;
      launchBird(entry);
    }
    var delay = allEntries.length===0 ? 2000 : (2500 + Math.random()*2000);
    setTimeout(scheduleBirds, delay);
  }

  /* ── SPOTLIGHT ── */
  function qSpot(e){ spotQ.push(e); if(!spotBusy) nextSpot(); }
  function nextSpot(){ if(!spotQ.length){spotBusy=false;return;} spotBusy=true; playSpot(spotQ.shift()); setTimeout(nextSpot,5800); }
  function playSpot(e){
    var p=e.name.trim().split(/\s+/);
    document.getElementById("splFirst").textContent=p[0]||"";
    document.getElementById("splLast").textContent=p.slice(1).join(" ")||"";
    var db2=document.getElementById("splDreamBox"), dt=document.getElementById("splDreamTxt");
    if(e.future){ dt.textContent=e.future; db2.style.display="block"; }
    else{ db2.style.display="none"; }
    buildRays(); burst();
    var sp=document.getElementById("spotlight");
    sp.classList.add("on");
    setTimeout(function(){ sp.classList.remove("on"); },5500);
  }
  function buildRays(){
    var b=document.getElementById("splRays"); b.innerHTML="";
    for(var i=0;i<24;i++){
      var r=document.createElement("div"); r.className="spl-ray";
      r.style.cssText="transform:rotate("+(i*15)+"deg);height:"+(30+Math.random()*28)+"vh;opacity:"+(0.08+Math.random()*.2)+";animation-delay:"+(Math.random()*.3)+"s";
      b.appendChild(r);
    }
  }
  function burst(){
    var c=document.getElementById("splPrts"); c.innerHTML="";
    var cols=["#00B4E6","#E800C8","#1A2A5E","#fff"];
    for(var i=0;i<80;i++){
      var el=document.createElement("div"); el.className="spp";
      var a=Math.random()*Math.PI*2, d=100+Math.random()*380;
      el.style.cssText="width:"+(4+Math.random()*9)+"px;height:"+(4+Math.random()*9)+"px;"+
        "background:"+cols[Math.floor(Math.random()*cols.length)]+";left:50%;top:45%;"+
        "--dx:"+(Math.cos(a)*d)+"px;--dy:"+(Math.sin(a)*d)+"px;"+
        "animation-duration:"+(1+Math.random()*1.4)+"s;animation-delay:"+(Math.random()*.35)+"s";
      c.appendChild(el);
    }
  }

  /* ── EXPORT ── */
  function doExport(){
    if(!db){alert("לא מחובר");return;}
    db.ref("k26b").once("value",function(snap){
      var rows=[]; snap.forEach(function(c){rows.push(c.val());});
      var BOM="\uFEFF";
      var hdr="\u05DE\u05E1\u05E4\u05E8,\u05E9\u05DD \u05DE\u05DC\u05D0,\u05D7\u05DC\u05D5\u05DD \u05DC-5 \u05E9\u05E0\u05D9\u05DD,\u05E9\u05E2\u05D4,\u05EA\u05D0\u05E8\u05D9\u05DA";
      var lines=rows.map(function(r,i){
        return (i+1)+',"'+(r.name||'')+'","'+(r.future||'')+'","'+(r.t||'')+'","'+(r.ts?r.ts.split("T")[0]:'')+ '"';
      });
      var csv=BOM+[hdr].concat(lines).join("\n");
      var blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a"); a.href=url;
      a.download="atidim-knes26-"+new Date().toISOString().slice(0,10)+".csv";
      a.click(); URL.revokeObjectURL(url);
    });
  }
  window.doExport=doExport;
  window.goFS=function(){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  };

  /* ── FIREBASE LISTENER ── */
  function startListening(){
    var first=true;
    db.ref("k26b").on("value",function(snap){
      if(first){
        first=false;
        var all=[]; snap.forEach(function(c){all.push(Object.assign({_k:c.key},c.val()));});
        all.sort(function(a,b){return a.ts<b.ts?-1:1;});
        all.forEach(function(e){ known[e._k]=true; allEntries.push(e); });
        setCount(all.length);
      }
    });
    db.ref("k26b").on("child_added",function(snap){
      if(known[snap.key])return; known[snap.key]=true;
      var e=Object.assign({_k:snap.key},snap.val());
      allEntries.push(e);
      qSpot(e);
      db.ref("k26b").once("value",function(s){setCount(s.numChildren());});
    });
  }

  /* ── BOOT ── */
  injectLogos();
  drawQR();
  startListening();
  scheduleBirds();
});
</script>
</body>
</html>
